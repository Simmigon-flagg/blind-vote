<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4dff">
<title>Blind Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f6f5fb; --card:#ffffff; --ink:#16142b; --mute:#6e6a85; --line:#e9e7f3; --soft:#f1effa;
    --acc:#5b4dff; --acc2:#9b5cff; --acc-ink:#fff; --acc-soft:#ecebff;
    --pass:#12a150; --pass-soft:#e3f6ec; --fail:#e5484d; --fail-soft:#fdeaea; --tie:#f5a524; --tie-soft:#fff3dc;
    --r:18px; --shadow:0 1px 2px rgba(22,20,43,.04), 0 8px 24px rgba(22,20,43,.06);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0e0d18; --card:#17162a; --ink:#f0eefb; --mute:#a19dbb; --line:#2a2843; --soft:#1f1d36;
    --acc:#8c80ff; --acc2:#b48cff; --acc-ink:#0e0d18; --acc-soft:#25224a;
    --pass-soft:#11301f; --fail-soft:#3a1618; --tie-soft:#3a2a0c; --shadow:none; } }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; font:15.5px/1.5 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  a { color:inherit; } button, input, textarea, select { font:inherit; color:inherit; }

  /* ---------- top bar ---------- */
  .top { position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:saturate(1.4) blur(14px);
         padding:calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px; }
  .top-in { max-width:680px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.08rem; text-decoration:none; letter-spacing:-.02em; }
  .logo { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:#fff; font-size:1.05rem;
          background:linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow:0 6px 16px color-mix(in srgb, var(--acc) 35%, transparent); }
  .tabs { display:flex; gap:4px; }
  .tabs a { padding:8px 14px; border-radius:12px; font-weight:700; font-size:.88rem; text-decoration:none; color:var(--mute); }
  .tabs a.on { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }

  /* bottom tab bar on phones */
  .dock { display:none; }
  @media (max-width:560px) {
    .tabs { display:none; }
    .dock:not([hidden]) { display:flex; position:fixed; z-index:10; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
      background:color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:22px;
      box-shadow:0 10px 30px rgba(22,20,43,.14); padding:6px; gap:6px; }
    .dock a { flex:1; display:flex; flex-direction:column; align-items:center; gap:1px; padding:8px 4px; border-radius:16px; text-decoration:none;
      color:var(--mute); font-weight:700; font-size:.74rem; }
    .dock a span { font-size:1.2rem; line-height:1.2; }
    .dock a.on { background:var(--acc-soft); color:var(--acc); }
  }

  main { max-width:680px; margin:0 auto; padding:8px 18px calc(env(safe-area-inset-bottom, 0px) + 110px); }
  h1 { font-size:1.6rem; line-height:1.2; margin:6px 0 6px; letter-spacing:-.03em; font-weight:800; }
  h2 { font-size:1rem; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--mute); margin:0 0 20px; }
  .mute { color:var(--mute); font-size:.86rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin-bottom:14px; box-shadow:var(--shadow); }

  /* ---------- hero (vote + results) ---------- */
  .hero { position:relative; overflow:hidden; border-radius:24px; padding:22px 20px 20px; margin:6px 0 16px; color:#fff;
          background:radial-gradient(120% 140% at 0% 0%, var(--acc2) 0%, var(--acc) 55%, #3b2fd9 100%); }
  .hero::after { content:""; position:absolute; right:-40px; top:-40px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.08); }
  .hero .kicker { font-size:.74rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.8; }
  .hero h1 { color:#fff; font-size:1.55rem; margin:8px 0 14px; position:relative; z-index:1; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; position:relative; z-index:1; }
  .pill { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff;
          padding:6px 11px; border-radius:999px; font-weight:700; font-size:.8rem; font-variant-numeric:tabular-nums; backdrop-filter:blur(6px); }

  /* ---------- forms ---------- */
  label.f { display:block; font-weight:700; margin:0 0 8px; font-size:.86rem; }
  .field { margin-bottom:18px; } .field:last-child { margin-bottom:0; }
  input[type=text], input:not([type]), input[type=search], input[type=datetime-local], textarea {
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); }
  input:focus, textarea:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft); }
  .hint { color:var(--mute); font-size:.8rem; margin-top:7px; }
  .count { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .count label.f { margin:0; }
  .stepper { display:flex; align-items:center; background:var(--soft); border-radius:14px; padding:4px; }
  .stepper button { width:36px; height:36px; border:0; border-radius:10px; background:var(--card); font-size:1.15rem; font-weight:800; cursor:pointer; box-shadow:var(--shadow); }
  .stepper button:disabled { opacity:.35; cursor:default; }
  .stepper b { min-width:36px; text-align:center; }
  .choice-in { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .letter { flex-shrink:0; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:.82rem;
            background:var(--acc-soft); color:var(--acc); }
  .seg { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; background:var(--soft); padding:4px; border-radius:14px; }
  .seg label { text-align:center; padding:10px 6px; border-radius:11px; font-weight:700; font-size:.82rem; cursor:pointer; color:var(--mute); line-height:1.25; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg label:has(input:checked) { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }

  /* ---------- buttons ---------- */
  .btn, button.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:14px; padding:13px 20px;
    font-weight:800; cursor:pointer; text-decoration:none; background:linear-gradient(135deg, var(--acc), var(--acc2)); color:#fff;
    box-shadow:0 8px 20px color-mix(in srgb, var(--acc) 30%, transparent); }
  .btn.ghost { background:var(--card); color:var(--ink); border:1.5px solid var(--line); box-shadow:none; }
  .btn.danger { background:var(--fail); box-shadow:none; }
  .btn.sm { padding:8px 13px; border-radius:11px; font-size:.84rem; }
  .btn.wide { width:100%; }
  .btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .err { color:var(--fail); margin-top:10px; font-weight:700; font-size:.9rem; }

  /* ---------- voting options ---------- */
  .opts { display:grid; gap:10px; }
  .opt { position:relative; display:flex; align-items:center; gap:12px; padding:14px 16px; border:1.5px solid var(--line); border-radius:16px;
         background:var(--card); cursor:pointer; font-weight:700; transition:border-color .15s, transform .1s; }
  .opt:active { transform:scale(.99); }
  .opt input[type=radio] { position:absolute; opacity:0; pointer-events:none; }
  .opt:has(input:checked) { border-color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft); }
  .opt:has(input:checked) .letter { background:var(--acc); color:#fff; }
  .opt .check { margin-left:auto; width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; }
  .opt:has(input:checked) .check { border:7px solid var(--acc); }
  .opt #wi { flex:1; min-width:0; padding:8px 10px; border-radius:10px; font-weight:500; }

  /* results: the bar fills behind the option */
  .res { position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; padding:14px 16px; border:1.5px solid var(--line);
         border-radius:16px; background:var(--card); font-weight:700; }
  .res .fill { position:absolute; inset:0 auto 0 0; background:var(--acc-soft); border-radius:0 12px 12px 0; transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .res > *:not(.fill) { position:relative; }
  .res .pct { margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .res .n { color:var(--mute); font-weight:600; font-size:.82rem; }
  .res.win { border-color:color-mix(in srgb, var(--pass) 45%, var(--line)); }
  .res.win .fill { background:var(--pass-soft); }
  .res.win .letter { background:var(--pass); color:#fff; }

  /* ---------- status bubbles ---------- */
  .bub { flex-shrink:0; display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; font-weight:800; font-size:.74rem;
         max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bub.pass { background:var(--pass-soft); color:var(--pass); } .bub.fail { background:var(--fail-soft); color:var(--fail); }
  .bub.tie { background:var(--tie-soft); color:#b4720a; } .bub.open { background:var(--acc-soft); color:var(--acc); }
  .bub.gone { background:var(--soft); color:var(--mute); }
  .bub::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }
  @media (prefers-color-scheme: dark) { .bub.tie { color:var(--tie); } }

  /* ---------- my polls ---------- */
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:6px 0 14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 10px; text-align:center; box-shadow:var(--shadow); }
  .stat b { display:block; font-size:1.35rem; letter-spacing:-.02em; }
  .stat span { color:var(--mute); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .stat.pass b { color:var(--pass); } .stat.fail b { color:var(--fail); } .stat.open b { color:var(--acc); }
  .tools { position:sticky; top:calc(env(safe-area-inset-top, 0px) + 58px); z-index:5; background:var(--bg); padding:4px 0 12px; }
  .search { position:relative; }
  .search input { padding-left:42px; border-radius:16px; background:var(--card); }
  .search svg { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--mute); }
  .chips { display:flex; gap:6px; margin-top:10px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex-shrink:0; border:1.5px solid var(--line); background:var(--card); color:var(--mute); padding:7px 13px; border-radius:999px; font-size:.82rem; font-weight:700; cursor:pointer; }
  .chip.on { background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .plist { display:grid; gap:10px; }
  .pcard { position:relative; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--r);
           padding:14px 12px 14px 18px; box-shadow:var(--shadow); overflow:hidden; }
  .pcard::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--line); }
  .pcard.pass::before { background:var(--pass); } .pcard.fail::before { background:var(--fail); } .pcard.tie::before { background:var(--tie); }
  .pcard.open::before { background:linear-gradient(var(--acc), var(--acc2)); }
  .pcard a.main { flex:1; min-width:0; text-decoration:none; }
  .pcard .t { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:-.01em; }
  .pcard .m { color:var(--mute); font-size:.78rem; margin-top:2px; }
  .pcard .m .req { color:var(--acc); font-weight:800; }
  .icon { border:0; background:transparent; color:var(--mute); width:36px; height:36px; border-radius:11px; cursor:pointer; display:grid; place-items:center; flex-shrink:0; }
  .icon:hover { background:var(--soft); color:var(--fail); }
  .confirm { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px; border-radius:var(--r); background:var(--fail-soft); margin-top:-4px; }
  .confirm span { flex:1; font-size:.86rem; font-weight:700; min-width:170px; }
  .empty { text-align:center; padding:44px 20px; }
  .empty .big { font-size:2.4rem; }
  .empty b { display:block; font-size:1.1rem; margin:8px 0 4px; }
  .more { display:flex; margin:14px auto 0; }

  /* ---------- misc ---------- */
  .linkbox { display:flex; gap:8px; align-items:center; background:var(--soft); border-radius:14px; padding:6px 6px 6px 14px; }
  .linkbox code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.8rem; color:var(--mute); }
  .back { display:inline-flex; align-items:center; gap:4px; color:var(--mute); text-decoration:none; font-weight:700; font-size:.86rem; }
  .req-item { display:flex; align-items:center; gap:8px; padding:12px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .req-item:first-of-type { border-top:0; }
  .req-item .t { flex:1; min-width:120px; font-weight:700; overflow-wrap:anywhere; }
  .badge { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 7px; border-radius:999px; background:var(--acc); color:#fff; font-size:.74rem; font-weight:800; vertical-align:2px; }
  .notice { display:flex; gap:10px; align-items:flex-start; padding:14px 16px; border-radius:16px; background:var(--soft); font-weight:600; font-size:.9rem; }
  .done { text-align:center; padding:34px 22px; }
  .done .big { width:64px; height:64px; margin:0 auto 12px; border-radius:20px; display:grid; place-items:center; font-size:1.9rem; background:var(--pass-soft); }
  .done.warn .big { background:var(--tie-soft); }
  .danger-zone { border-color:color-mix(in srgb, var(--fail) 30%, var(--line)); }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 96px); transform:translate(-50%, 10px); background:var(--ink); color:var(--bg);
           padding:11px 18px; border-radius:14px; font-weight:700; font-size:.88rem; opacity:0; transition:.2s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  .skeleton { height:68px; border-radius:var(--r); background:linear-gradient(90deg, var(--card), var(--soft), var(--card)); background-size:200% 100%; animation:sk 1.2s infinite; }
  @keyframes sk { to { background-position:-200% 0; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="./"><span class="logo">✓</span> Blind Vote</a>
  <nav class="tabs" id="tabs" hidden><a href="#mine" data-tab="mine">My polls</a><a href="#new" data-tab="new">+ New poll</a></nav>
</div></header>
<main id="app"><div class="skeleton"></div></main>
<nav class="dock" id="dock" hidden><a href="#mine" data-tab="mine"><span>🗂</span>My polls</a><a href="#new" data-tab="new"><span>＋</span>New poll</a></nav>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm";

const app = document.getElementById("app");
const cfg = window.BLIND_VOTE_CONFIG || {};
const q = new URLSearchParams(location.search);
const base = location.origin + location.pathname;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const L = i => String.fromCharCode(65 + (i % 26)); // A, B, C…
// Times are stored in UTC and shown in the viewer's own timezone.
const fmtTime = iso => new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" });
const fmtDay = iso => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const left = ms => { const t = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
  return (d ? d + "d " : "") + (d || h ? h + "h " : "") + m + "m " + String(sec).padStart(2, "0") + "s"; };
const leftShort = ms => left(ms).replace(/ \d+s$/, "");
// Live countdown in any element with data-closes="ISO". When it hits zero the page reloads to show results.
setInterval(() => document.querySelectorAll("[data-closes]").forEach(el => {
  const ms = new Date(el.dataset.closes) - new Date();
  el.textContent = ms > 0 ? "⏳ " + left(ms) + " left" : "Voting closed";
  if (ms <= 0 && el.dataset.reload) { delete el.dataset.reload; setTimeout(() => location.reload(), 1500); }
}), 1000);
const countdown = (iso, reload) => `<span class="pill" title="${esc(fmtTime(iso))}" data-closes="${esc(iso)}"${reload ? ' data-reload="1"' : ""}>⏳ ${left(new Date(iso) - new Date())} left</span>`;
const closesPill = iso => `<span class="pill">📅 ${esc(fmtTime(iso))}</span>`;
const hero = (kicker, title, pills) => `<section class="hero"><div class="kicker">${kicker}</div><h1>${esc(title)}</h1><div class="pills">${pills}</div></section>`;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Link copied"); } catch (e) { prompt("Copy this link:", text); } }
const ICON_SEARCH = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
const ICON_TRASH = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>`;

if (!cfg.SUPABASE_URL || !cfg.SUPABASE_KEY) {
  app.innerHTML = `<div class="card">Not configured yet. Set <code>SUPABASE_URL</code> and <code>SUPABASE_KEY</code> in <code>config.js</code>.</div>`;
  throw new Error("missing config");
}
const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY, { auth: { persistSession: false } });
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw new Error(error.message); return data; };

const poll = q.get("p"), token = q.get("t"), admin = q.get("admin");
// One random id per browser, so the shared link gives each device one vote (refresh can't re-vote).
function deviceId() {
  try {
    let d = localStorage.getItem("bv_device");
    if (!d) { d = crypto.randomUUID(); localStorage.setItem("bv_device", d); }
    return d;
  } catch (e) { return crypto.randomUUID(); }
}
// "My polls": saved on this device only, so the creator keeps every admin link.
const myPolls = () => { try { return JSON.parse(localStorage.getItem("bv_mypolls") || "[]"); } catch (e) { return []; } };
const setMyPolls = list => { try { localStorage.setItem("bv_mypolls", JSON.stringify(list.slice(0, 200))); } catch (e) {} };
const saveMyPoll = p => setMyPolls([p, ...myPolls().filter(x => x.id !== p.id)]);
const forgetPoll = id => setMyPolls(myPolls().filter(x => x.id !== id));
const adminUrl = (id, key) => `${base}?p=${id}&admin=${encodeURIComponent(key)}`;
const voteUrl = id => `${base}?p=${id}`;

// ---------- routing ----------
function setTab(tab) {
  ["tabs", "dock"].forEach(id => document.getElementById(id).hidden = !tab);
  document.querySelectorAll("[data-tab]").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
}
function route() {
  if (poll && token) return votePage();
  if (poll && admin) { setTab("mine"); return resultsPage(); }
  if (poll) return openVotePage();
  const tab = location.hash === "#new" || (location.hash !== "#mine" && !myPolls().length) ? "new" : "mine";
  setTab(tab); window.scrollTo(0, 0);
  tab === "new" ? createPage() : myPollsPage();
}

// ---------- create ----------
function createPage() {
  app.innerHTML = `
    <h1>New poll</h1><p class="sub">One link for everyone · one vote per phone · votes are anonymous.</p>
    <form id="f">
      <div class="card">
        <div class="field"><label class="f" for="qq">Question</label><input id="qq" maxlength="500" placeholder="What should we decide?" required></div>
        <div class="field">
          <div class="count"><label class="f">Choices</label>
            <div class="stepper"><button type="button" id="minus" aria-label="Fewer choices">−</button><b id="num">2</b><button type="button" id="plus" aria-label="More choices">+</button></div></div>
          <div id="choices"></div>
          <div class="hint">Each choice can be a word, a name, or a whole sentence.</div>
        </div>
      </div>
      <div class="card">
        <div class="field"><label class="f">Can voters add options?</label>
          <div class="seg">
            <label><input type="radio" name="om" value="off" checked>No</label>
            <label><input type="radio" name="om" value="approve">Ask me first</label>
            <label><input type="radio" name="om" value="auto">Yes, auto-add</label>
          </div>
          <div class="hint" id="omHint"></div></div>
        <div class="field"><label class="f" for="cc">Voting closes</label><input id="cc" type="datetime-local" required>
          <div class="hint">Your time. Voting stops automatically and results open to everyone. You can close it early.</div></div>
      </div>
      <button class="btn wide">Create poll</button><div class="err" id="e"></div>
    </form>`;
  const OM_HINT = { off: "Voters can only pick from your choices.", approve: "Voters can request a new option. You approve or deny it from your poll page.", auto: "Voters can write in their own option. It's added right away." };
  const omHint = document.getElementById("omHint");
  const syncHint = () => omHint.textContent = OM_HINT[document.querySelector('input[name="om"]:checked').value];
  document.querySelectorAll('input[name="om"]').forEach(r => r.onchange = syncHint); syncHint();
  // Choice boxes: pick how many, then type each one. Typed text is kept when the count changes.
  const box = document.getElementById("choices"), MIN = 2, MAX = 20;
  // Start empty: placeholders show a choice can be a word OR a full sentence, not just Yes/No.
  const EXAMPLES = ["e.g. Yes", "e.g. Meet Saturday at the park"];
  let vals = ["", ""];
  const drawChoices = () => {
    box.innerHTML = vals.map((v, i) => `<div class="choice-in"><span class="letter">${L(i)}</span><input class="choice" data-i="${i}" maxlength="200" placeholder="${esc(EXAMPLES[i] || "Type a word or a short sentence")}" value="${esc(v)}" required></div>`).join("");
    document.getElementById("num").textContent = vals.length;
    document.getElementById("minus").disabled = vals.length <= MIN;
    document.getElementById("plus").disabled = vals.length >= MAX;
    box.querySelectorAll(".choice").forEach(el => el.oninput = () => { vals[+el.dataset.i] = el.value; });
  };
  document.getElementById("minus").onclick = () => { if (vals.length > MIN) { vals.pop(); drawChoices(); } };
  document.getElementById("plus").onclick = () => { if (vals.length < MAX) { vals.push(""); drawChoices(); box.querySelector(".choice-in:last-child input").focus(); } };
  drawChoices();
  // default: 24 hours from now, in local time
  const cc = document.getElementById("cc"), pad = n => String(n).padStart(2, "0"), dflt = new Date(Date.now() + 864e5);
  cc.value = `${dflt.getFullYear()}-${pad(dflt.getMonth() + 1)}-${pad(dflt.getDate())}T${pad(dflt.getHours())}:${pad(dflt.getMinutes())}`;
  document.getElementById("f").onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector("button.btn"), err = document.getElementById("e"); btn.disabled = true; err.textContent = "";
    const fail = m => { err.textContent = m; btn.disabled = false; };
    const closesAt = new Date(cc.value); // datetime-local is read as local time
    if (!(closesAt > new Date())) return fail("Pick a close time in the future.");
    const options = vals.map(s => s.trim());
    if (options.some(o => !o)) return fail("Fill in every choice, or tap − to remove one.");
    if (new Set(options.map(o => o.toLowerCase())).size !== options.length) return fail("Two choices are the same.");
    const question = document.getElementById("qq").value.trim();
    const mode = document.querySelector('input[name="om"]:checked').value;
    try {
      const r = await rpc("create_poll_open", { p_question: question, p_options: options, p_closes_at: closesAt.toISOString(), p_option_mode: mode });
      saveMyPoll({ id: r.poll_id, admin: r.admin_key, question, closes_at: closesAt.toISOString(), created_at: new Date().toISOString() });
      createdPage(r.poll_id, r.admin_key, question, closesAt.toISOString());
    } catch (e) { fail(e.message); }
  };
}

function createdPage(id, key, question, closesAt) {
  const a = adminUrl(id, key), v = voteUrl(id);
  window.scrollTo(0, 0);
  app.innerHTML = `
    ${hero("Poll created 🎉", question, countdown(closesAt) + closesPill(closesAt))}
    <div class="card"><h2>📣 Share this link with everyone</h2><p class="mute" style="margin:0 0 12px">Everyone uses the same link. One vote per phone.</p>
      <div class="linkbox"><code>${esc(v)}</code><button class="btn sm" data-c="${esc(v)}">Copy</button></div>
      <div class="row"><a class="btn ghost wide" href="${esc(v)}">🗳 Cast my own vote</a></div></div>
    <div class="card"><h2>🔑 Your admin link</h2><p class="mute" style="margin:0 0 12px">Live results, requests, close early, delete. Keep it private. It's saved in My polls on this device.</p>
      <div class="linkbox"><code>${esc(a)}</code><button class="btn sm ghost" data-c="${esc(a)}">Copy</button></div></div>
    <a class="btn ghost wide" href="${esc(a)}">Open poll dashboard</a>`;
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => copy(b.dataset.c));
}

// ---------- my polls ----------
// 2 options: Pass = first (e.g. Yes) wins, Fail = second wins, Tie = equal. More options: winner or Tie.
function verdict(s) {
  if (s.gone) return { k: "gone", t: "Deleted" };
  if (!s.closed) return { k: "open", t: "Open" + (s.closes_at ? " · " + leftShort(new Date(s.closes_at) - new Date()) : "") };
  const c = s.counts || [];
  if (s.options.length === 2) {
    const [a, b] = [c[0] || 0, c[1] || 0];
    return a > b ? { k: "pass", t: `Pass ${a}–${b}` } : a < b ? { k: "fail", t: `Fail ${a}–${b}` } : { k: "tie", t: `Tie ${a}–${b}` };
  }
  const top = Math.max(0, ...c), leaders = s.options.filter((o, j) => c[j] === top);
  return leaders.length === 1 ? { k: "pass", t: `🏆 ${leaders[0]}` } : { k: "tie", t: "Tie" };
}

const PAGE = 20;
const view = { search: "", filter: "all", shown: PAGE, data: {} }; // data: id -> summary from server
async function myPollsPage() {
  const list = myPolls();
  if (!list.length) {
    app.innerHTML = `<div class="card empty"><div class="big">🗳</div><b>No polls yet</b><p class="mute">Polls you create on this device show up here.</p>
      <a class="btn" href="#new">Create your first poll</a></div>`;
    return;
  }
  app.innerHTML = `
    <h1>My polls</h1>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div class="search">${ICON_SEARCH}<input id="qs" type="search" placeholder="Search polls" value="${esc(view.search)}" autocomplete="off"></div>
      <div class="chips" id="chips">${[["all", "All"], ["open", "Open"], ["closed", "Closed"], ["pass", "Pass"], ["fail", "Fail"], ["tie", "Tie"]]
        .map(([k, t]) => `<button class="chip${view.filter === k ? " on" : ""}" data-f="${k}">${t}</button>`).join("")}</div>
    </div>
    <div id="listWrap"><div class="plist">${'<div class="skeleton"></div>'.repeat(Math.min(4, list.length))}</div></div>
    <p class="mute" style="text-align:center;margin-top:16px">Saved on this device only.</p>`;
  const qs = document.getElementById("qs");
  qs.oninput = () => { view.search = qs.value; view.shown = PAGE; renderList(); };
  document.getElementById("chips").onclick = e => {
    const f = e.target.dataset && e.target.dataset.f; if (!f) return;
    view.filter = f; view.shown = PAGE;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.f === f));
    renderList();
  };
  try {
    const rows = await rpc("my_polls_summary", { p_items: list.map(p => ({ id: p.id, admin: p.admin })) });
    rows.forEach(r => view.data[r.id] = r);
  } catch (e) { toast("Couldn't load results"); }
  renderList();
}

function renderList() {
  const wrap = document.getElementById("listWrap"); if (!wrap) return;
  const all = myPolls().map(p => ({ p, s: view.data[p.id], v: view.data[p.id] ? verdict(view.data[p.id]) : { k: "open", t: "…" } }));
  const n = k => all.filter(x => x.v.k === k).length;
  document.getElementById("stats").innerHTML = `<div class="stat"><b>${all.length}</b><span>Total</span></div>
    <div class="stat open"><b>${n("open")}</b><span>Open</span></div><div class="stat pass"><b>${n("pass")}</b><span>Pass</span></div><div class="stat fail"><b>${n("fail")}</b><span>Fail</span></div>`;
  const needle = view.search.trim().toLowerCase();
  const rows = all.filter(({ p, s, v }) =>
    (!needle || ((s && s.question) || p.question || "").toLowerCase().includes(needle)) &&
    (view.filter === "all" || (view.filter === "closed" ? s && s.closed && !s.gone : v.k === view.filter)));
  if (!rows.length) { wrap.innerHTML = `<div class="card empty"><div class="big">🔍</div><b>No matches</b><p class="mute">Try a different search or filter.</p></div>`; return; }
  wrap.innerHTML = `<div class="plist">${rows.slice(0, view.shown).map(({ p, s, v }) => `
    <div class="pcard ${v.k}" data-id="${esc(p.id)}">
      <a class="main" href="${esc(adminUrl(p.id, p.admin))}">
        <div class="t">${esc((s && s.question) || p.question)}</div>
        <div class="m">${s && !s.gone ? s.votes + (s.votes == 1 ? " vote" : " votes") : ""}${p.created_at ? " · " + esc(fmtDay(p.created_at)) : ""}${s && s.pending ? ` · <span class="req">${s.pending} request${s.pending == 1 ? "" : "s"}</span>` : ""}</div>
      </a>
      <span class="bub ${v.k}" title="${esc(v.t)}">${esc(v.t)}</span>
      <button class="icon" data-del="${esc(p.id)}" aria-label="Delete poll" title="Delete">${ICON_TRASH}</button>
    </div>`).join("")}</div>
    ${rows.length > view.shown ? `<button class="btn ghost more" id="more">Show more (${rows.length - view.shown})</button>` : ""}`;
  const more = document.getElementById("more");
  if (more) more.onclick = () => { view.shown += PAGE; renderList(); };
  wrap.querySelectorAll("[data-del]").forEach(b => b.onclick = () => askDelete(b.closest(".pcard"), b.dataset.del));
}

// Inline confirm under the card — no pop-up dialogs.
function askDelete(item, id) {
  document.querySelectorAll(".confirm").forEach(c => c.remove());
  const p = myPolls().find(x => x.id === id), s = view.data[id], gone = s && s.gone;
  item.insertAdjacentHTML("afterend", `<div class="confirm"><span>${gone ? "Remove it from your list?" : "Delete this poll and all its votes for everyone?"}</span>
    <button class="btn sm danger" id="yesDel">${gone ? "Remove" : "Delete"}</button><button class="btn sm ghost" id="noDel">Cancel</button></div>`);
  document.getElementById("noDel").onclick = () => document.querySelector(".confirm").remove();
  document.getElementById("yesDel").onclick = async () => {
    try { if (!gone) await rpc("delete_poll", { p_poll: id, p_admin: p.admin }); }
    catch (e) { if (!/already deleted/.test(e.message)) { toast(e.message); return; } }
    forgetPoll(id); delete view.data[id]; toast(gone ? "Removed" : "Poll deleted");
    myPolls().length ? renderList() : myPollsPage();
  };
}

// ---------- voting ----------
const optCards = (options, extra = "") => `<div class="opts">${options.map((o, i) => `
  <label class="opt"><input type="radio" name="c" value="${i}" required><span class="letter">${L(i)}</span><span>${esc(o)}</span><span class="check"></span></label>`).join("")}${extra}</div>`;
function doneCard(icon, title, body, warn) {
  return `<div class="card done${warn ? " warn" : ""}"><div class="big">${icon}</div><h2>${esc(title)}</h2><p class="mute">${esc(body)}</p></div>`;
}

async function votePage() { // one-time personal links (older polls)
  try {
    const p = await rpc("get_poll", { p_poll: poll, p_token: token });
    if (!p.token_valid) return msg("Invalid link", "This voting link isn't valid for this poll.");
    if (p.token_used) return msg("Already voted", "This link has been used. Your vote was recorded anonymously.");
    if (p.closed) return msg("Voting closed", "This poll is no longer accepting votes.");
    app.innerHTML = `${hero("Anonymous vote", p.question, `<span class="pill">🔒 Personal link</span>`)}
      <form id="f">${optCards(p.options)}<div class="row"><button class="btn wide">Submit vote</button></div><div class="err" id="e"></div></form>`;
    document.getElementById("f").onsubmit = async ev => {
      ev.preventDefault();
      const btn = ev.target.querySelector("button.btn"); btn.disabled = true;
      const choice = +new FormData(ev.target).get("c");
      try { await rpc("cast_vote", { p_poll: poll, p_token: token, p_choice: choice }); msg("Vote recorded", "Thanks! Refreshing this page won't give you another vote.", "✅"); }
      catch (e) { document.getElementById("e").textContent = e.message; btn.disabled = false; }
    };
  } catch (e) { msg("Error", e.message); }
}

async function openVotePage() {
  try {
    const dev = deviceId();
    const p = await rpc("get_poll_open", { p_poll: poll, p_device: dev });
    if (p.closed) return resultsPage();
    const pills = (p.closes_at ? countdown(p.closes_at, true) + closesPill(p.closes_at) : "") + `<span class="pill">🔒 Anonymous</span>`;
    if (p.voted) {
      app.innerHTML = hero("Blind vote", p.question, pills) +
        doneCard("🙌", "You already voted", "This phone already voted, so this visit was logged as a blocked repeat try. Results appear here when voting closes.", true);
      return;
    }
    const req = p.my_request;
    app.innerHTML = `${hero("Blind vote", p.question, pills)}
      <form id="f">
        ${optCards(p.options, p.option_mode === "auto" ? `<label class="opt"><input type="radio" name="c" value="other" required><span class="letter">+</span>Other <input id="wi" maxlength="200" placeholder="type your own"><span class="check"></span></label>` : "")}
        <div class="row"><button class="btn wide">Submit vote</button></div><div class="err" id="e"></div>
      </form>
      ${p.option_mode === "approve" ? `<div class="card" style="margin-top:16px" id="reqCard">${req ? requestStatus(req) : `
        <h2>Don't see your choice?</h2><p class="mute" style="margin:0 0 12px">Ask the poll owner to add it. You can vote once it's approved.</p>
        <form id="rf" class="choice-in" style="margin:0"><input id="rt" maxlength="200" placeholder="Suggest an option" required><button class="btn sm">Send</button></form>
        <div class="err" id="re"></div>`}</div>` : ""}
      <p class="mute" style="text-align:center;margin-top:14px">Your vote isn't linked to you. One vote per phone.</p>`;
    const wi = document.getElementById("wi");
    if (wi) wi.onfocus = () => { document.querySelector('input[value="other"]').checked = true; };
    const rf = document.getElementById("rf");
    if (rf) rf.onsubmit = async ev => {
      ev.preventDefault();
      const b = rf.querySelector("button"); b.disabled = true;
      try { const r = await rpc("request_option", { p_poll: poll, p_device: dev, p_text: document.getElementById("rt").value });
        document.getElementById("reqCard").innerHTML = requestStatus(r); toast("Request sent"); }
      catch (e) { document.getElementById("re").textContent = e.message; b.disabled = false; }
    };
    document.getElementById("f").onsubmit = async ev => {
      ev.preventDefault();
      const btn = ev.target.querySelector("button.btn"); btn.disabled = true;
      const picked = new FormData(ev.target).get("c");
      const writeIn = picked === "other" ? wi.value.trim() : null;
      if (picked === "other" && !writeIn) { document.getElementById("e").textContent = "Type your option, or pick one above."; btn.disabled = false; return; }
      try {
        const res = await rpc("cast_vote_open", { p_poll: poll, p_device: dev, p_choice: writeIn ? -1 : +picked, p_write_in: writeIn });
        window.scrollTo(0, 0);
        if (res && res.ok === false) { app.innerHTML = hero("Blind vote", p.question, pills) + doneCard("🙌", "You already voted", res.message + ". The poll owner can see a repeat try was blocked.", true); return; }
        app.innerHTML = hero("Blind vote", p.question, pills) + doneCard("✅", "Vote recorded", "Thanks! Your vote is anonymous. Results appear here when voting closes.");
      }
      catch (e) { document.getElementById("e").textContent = e.message; btn.disabled = false; }
    };
  } catch (e) { msg("Not found", "This poll doesn't exist or was deleted."); }
}
function requestStatus(r) {
  const m = { pending: ["⏳", "Waiting for approval", "The poll owner will approve or deny it. Check back before voting."],
              approved: ["✅", "Your option was added", "It's in the list above. Vote for it!"],
              denied: ["❌", "Your option wasn't added", "The poll owner denied it. You can still vote for any choice above."] }[r.status];
  return `<div class="notice"><span>${m[0]}</span><div><div>${m[1]}: “${esc(r.text)}”</div><div class="mute" style="font-weight:500">${m[2]}</div></div></div>`;
}

// ---------- results / admin ----------
async function resultsPage() {
  try {
    const r = await rpc("get_results", { p_poll: poll, p_admin: admin });
    const counts = r.counts || [], sum = counts.reduce((a, b) => a + b, 0), top = Math.max(0, ...counts);
    const v = verdict({ ...r, gone: false });
    const votes = r.total ? `${r.voted} of ${r.total} voted` : `${r.voted} ${r.voted === 1 ? "vote" : "votes"}`;
    const pills = `<span class="pill">🗳 ${votes}</span>` + (r.closed ? `<span class="pill">🔒 Closed</span>` : (r.closes_at ? countdown(r.closes_at, true) + closesPill(r.closes_at) : ""));
    app.innerHTML = `
      ${r.is_admin ? `<a class="back" href="./#mine">← My polls</a>` : ""}
      ${hero(r.closed ? "Final results" : "Your poll · voting open", r.question, pills)}
      ${r.closed ? `<div style="margin:-4px 0 12px"><span class="bub ${v.k}" style="max-width:none">${esc(v.t)}</span></div>` : ""}
      ${r.closed ? "" : `<div class="notice" style="margin-bottom:12px"><span>🙈</span><div>Results are hidden from everyone, including you, until voting closes.
        <div class="mute" style="font-weight:500">You can see how many people voted, but not what they picked.</div></div></div>`}
      <div class="opts">${r.closed ? "" : r.options.map((o, i) => `<div class="res"><span class="letter">${L(i)}</span><span>${esc(o)}</span><span class="pct n">hidden</span></div>`).join("")}${!r.closed ? "" : r.options.map((o, i) => {
        const pct = sum ? Math.round(counts[i] / sum * 100) : 0, win = top > 0 && counts[i] === top;
        return `<div class="res${win ? " win" : ""}"><div class="fill" style="width:${pct}%"></div><span class="letter">${win ? "🏆" : L(i)}</span>
          <span>${esc(o)}</span><span class="pct">${pct}% <span class="n">· ${counts[i]}</span></span></div>`; }).join("")}</div>
      ${r.is_admin ? `
        <div id="reqs"></div>
        <div class="card" style="margin-top:16px"><h2>📣 Voting link</h2><p class="mute" style="margin:0 0 12px">Same link for everyone. After voting closes, it shows these results.</p>
          <div class="linkbox"><code>${esc(voteUrl(poll))}</code><button class="btn sm" data-c="${esc(voteUrl(poll))}">Copy</button></div>
          <div class="row">${r.closed ? "" : `<span id="closeRow"><button class="btn ghost sm" id="tog">Close voting now</button></span>`}<button class="btn ghost sm" id="ref">↻ Refresh</button></div></div>
        <div class="card"><h2>🚫 Blocked repeat tries · ${r.blocked || 0}</h2>
          <p class="mute" style="margin:0">A phone that already voted opened the link again or tried to vote again. Private tabs and other phones can't be detected.</p></div>
        <div class="card danger-zone"><h2>Delete poll</h2><p class="mute" style="margin:0">Removes the poll and all its votes for everyone. This can't be undone.</p>
          <div class="row" id="delRow"><button class="btn ghost sm" id="del">🗑 Delete poll</button></div></div>` : ""}`;
    if (!r.is_admin) return;
    saveMyPoll({ ...(myPolls().find(x => x.id === poll) || {}), id: poll, admin, question: r.question, closes_at: r.closes_at }); // keep it in My polls
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => copy(b.dataset.c));
    // Closing is final (reopening would allow peeking at totals), so confirm first.
    if (!r.closed) document.getElementById("tog").onclick = () => {
      document.getElementById("closeRow").innerHTML = `<button class="btn sm danger" id="closeYes">Close for good & show results</button> <button class="btn sm ghost" id="closeNo">Cancel</button>`;
      document.getElementById("closeNo").onclick = resultsPage;
      document.getElementById("closeYes").onclick = async () => { try { await rpc("set_closed", { p_poll: poll, p_admin: admin, p_closed: true }); } catch (e) { toast(e.message); } resultsPage(); };
    };
    document.getElementById("ref").onclick = resultsPage;
    document.getElementById("del").onclick = () => {
      document.getElementById("delRow").innerHTML = `<button class="btn sm danger" id="delYes">Yes, delete it</button><button class="btn sm ghost" id="delNo">Cancel</button>`;
      document.getElementById("delNo").onclick = resultsPage;
      document.getElementById("delYes").onclick = async () => {
        try { await rpc("delete_poll", { p_poll: poll, p_admin: admin }); } catch (e) { toast(e.message); return; }
        forgetPoll(poll); location.href = "./#mine";
      };
    };
    renderRequests(r.closed);
  } catch (e) { /hidden/.test(e.message) ? msg("Results are hidden", "They'll show here once voting closes.", "🔒") : msg("Not found", "This poll doesn't exist or was deleted."); }
}

// Creator's option requests: approve adds the option for everyone; deny keeps it out.
async function renderRequests(closed) {
  const box = document.getElementById("reqs"); if (!box) return;
  let list = [];
  try { list = await rpc("list_requests", { p_poll: poll, p_admin: admin }); } catch (e) { return; }
  if (!list.length) return;
  const pending = list.filter(x => x.status === "pending");
  box.innerHTML = `<div class="card" style="margin-top:16px"><h2>📝 Option requests ${pending.length ? `<span class="badge">${pending.length}</span>` : ""}</h2>
    ${list.map(x => `<div class="req-item"><span class="t">${esc(x.text)}</span>${x.status === "pending"
      ? (closed ? `<span class="bub gone">Voting closed</span>` : `<button class="btn sm" data-ok="${x.id}">Approve</button><button class="btn sm ghost" data-no="${x.id}">Deny</button>`)
      : `<span class="bub ${x.status === "approved" ? "pass" : "fail"}">${x.status === "approved" ? "Approved" : "Denied"}</span>`}</div>`).join("")}</div>`;
  const decide = async (id, ok) => { try { await rpc("decide_request", { p_poll: poll, p_admin: admin, p_request: +id, p_approve: ok }); toast(ok ? "Option added" : "Request denied"); resultsPage(); } catch (e) { toast(e.message); } };
  box.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => decide(b.dataset.ok, true));
  box.querySelectorAll("[data-no]").forEach(b => b.onclick = () => decide(b.dataset.no, false));
}

function msg(title, body, icon = "ℹ️") { app.innerHTML = doneCard(icon, title, body, icon !== "✅"); }

// Start last, so every const above (PAGE, view, …) exists before the first page renders.
window.addEventListener("hashchange", route);
route();
</script>
